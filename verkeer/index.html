<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Herhalingsquiz Verkeer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Overpass:wght@600;800&display=swap">
<style>
/* Layout: één vraagkaart per scherm, zoals een verkeersbord: groot, rustig, één boodschap tegelijk. */
:root {
  --bg: #eef2f7;
  --card: #ffffff;
  --fg: #14213a;
  --muted: #56627a;
  --line: #d4dbe6;
  --sign-blue: #1d5bb4;
  --sign-blue-soft: #e3ecf9;
  --sign-red: #c62828;
  --good: #1e7d3c;
  --good-soft: #e2f3e7;
  --bad: #c62828;
  --bad-soft: #fbe5e5;
  --amber: #f2b705;
  --font-display: "Overpass", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Verdana", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1624; --card: #182234; --fg: #e8edf6; --muted: #9ba8bf; --line: #2c3a52;
  --sign-blue: #5b95ea; --sign-blue-soft: #1c2d4a; --sign-red: #ef6b6b;
  --good: #5cc97e; --good-soft: #163324; --bad: #ef6b6b; --bad-soft: #3a1c1f; --amber: #f2c434;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1624; --card: #182234; --fg: #e8edf6; --muted: #9ba8bf; --line: #2c3a52;
  --sign-blue: #5b95ea; --sign-blue-soft: #1c2d4a; --sign-red: #ef6b6b;
  --good: #5cc97e; --good-soft: #163324; --bad: #ef6b6b; --bad-soft: #3a1c1f; --amber: #f2c434;
  color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 18px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px }
.wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 18px }
h1, h2, .display { font-family: var(--font-display); text-wrap: balance; margin: 0 }
button { font: inherit; color: inherit; cursor: pointer }
button:focus-visible, a:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px }

/* Kop */
.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap }
.top h1 { font-size: 1.35rem; font-weight: 800; flex: 1; min-width: 0 }
.logo { flex: none; height: 60px; width: auto; display: block; background: #fff; border-radius: 12px; padding: 4px 8px; pointer-events: none; user-select: none }
@media (max-width: 480px) { .logo { height: 46px } }
.tools { display: flex; gap: 8px; flex-wrap: wrap }
.chip { border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 14px; font-size: .9rem; font-weight: 700; display: inline-flex; align-items: center; gap: 6px }
.chip[aria-pressed="true"] { border-color: var(--sign-blue); background: var(--sign-blue-soft); color: var(--sign-blue) }

/* Voortgang */
.timer { display: grid; gap: 6px }
.timer-top { display: flex; justify-content: space-between; align-items: center; font-size: .9rem; color: var(--muted); font-variant-numeric: tabular-nums }
.timer-top b { font-family: var(--font-display); font-size: 1.15rem; color: var(--fg) }
.timer-bar { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden }
.timer-bar > i { display: block; height: 100%; width: 100%; background: var(--good); border-radius: 99px; transition: width .2s linear, background .3s }
.timer.warn .timer-bar > i { background: var(--amber) }
.timer.danger .timer-bar > i { background: var(--bad) }
.timer.danger .timer-top b { color: var(--bad) }
.timer.paused .timer-bar > i { opacity: .45 }
.progress { display: flex; align-items: center; gap: 12px; font-variant-numeric: tabular-nums; color: var(--muted); font-size: .95rem }
.bar { flex: 1; height: 8px; background: var(--line); border-radius: 99px; overflow: hidden }
.bar > i { display: block; height: 100%; background: var(--sign-blue); width: 0; transition: width .3s }

/* Kaart */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px; display: grid; gap: 18px }
.eyebrow { font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700 }
.qrow { display: flex; gap: 14px; align-items: flex-start }
.qtext { font-family: var(--font-display); font-weight: 800; font-size: 1.55rem; line-height: 1.3; flex: 1; min-width: 0; text-wrap: balance }
.qnum { color: var(--sign-blue) }

.speak { flex: none; width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--sign-blue); background: var(--sign-blue-soft); color: var(--sign-blue); display: grid; place-items: center }
.speak.small { width: 44px; height: 44px }
.speak svg { width: 24px; height: 24px }
.speak.playing { background: var(--sign-blue); color: #fff; animation: pulse 1s infinite }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px var(--sign-blue-soft) } }

/* Afbeelding */
.figure { margin: 0; border-radius: 12px; overflow: hidden; background: var(--bg); display: grid; place-items: center }
.figure img { display: block; max-height: 340px; width: auto; max-width: 100%; object-fit: contain }
.placeholder { padding: 26px 20px; text-align: center; color: var(--muted); border: 2px dashed var(--line); border-radius: 12px; width: 100%; display: grid; gap: 6px; justify-items: center }
.placeholder b { color: var(--fg) }

/* Antwoorden */
.answers { display: grid; gap: 12px }
.ans { display: flex; gap: 10px; align-items: stretch }
.pick { flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px; text-align: left; padding: 12px 16px; border: 2px solid var(--line); background: var(--card); border-radius: 14px; font-size: 1.15rem; min-height: 64px; transition: border-color .15s, background .15s }
.pick:hover:not(:disabled) { border-color: var(--sign-blue) }
.pick:disabled { cursor: default }
.letter { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 1.2rem; background: var(--sign-blue); color: #fff }
.ans.correct .pick { border-color: var(--good); background: var(--good-soft) }
.ans.correct .letter { background: var(--good) }
.ans.wrong .pick { border-color: var(--bad); background: var(--bad-soft) }
.ans.wrong .letter { background: var(--bad) }
.mark { margin-left: auto; font-weight: 700; font-size: 1.4rem }
.ans.correct .mark { color: var(--good) }
.ans.wrong .mark { color: var(--bad) }

.feedback { border-radius: 12px; padding: 12px 16px; font-weight: 700; font-size: 1.1rem }
.feedback.good { background: var(--good-soft); color: var(--good) }
.feedback.bad { background: var(--bad-soft); color: var(--bad) }

.nav { display: flex; gap: 12px; justify-content: space-between; flex-wrap: wrap }
.btn { border: 0; border-radius: 14px; padding: 14px 24px; font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; background: var(--sign-blue); color: #fff }
.btn.ghost { background: transparent; color: var(--sign-blue); border: 2px solid var(--sign-blue) }
.btn:disabled { opacity: .4; cursor: default }

/* Start en einde */
.lessons { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px }
.lesson { text-align: left; border: 2px solid var(--line); background: var(--card); border-radius: 14px; padding: 14px 16px; display: grid; gap: 2px }
.lesson b { font-family: var(--font-display); font-size: 1.1rem }
.lesson span { color: var(--muted); font-size: .9rem }
.lesson:hover { border-color: var(--sign-blue) }
.lesson.all { border-color: var(--sign-blue); background: var(--sign-blue-soft) }
.intro { display: flex; gap: 14px; align-items: center }
.intro p { margin: 0; flex: 1; min-width: 0 }
.score { font-family: var(--font-display); font-size: 3.5rem; font-weight: 800; color: var(--sign-blue); font-variant-numeric: tabular-nums; line-height: 1 }
.keys { color: var(--muted); font-size: .85rem }
kbd { font-family: var(--font-body); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 6px; background: var(--card) }

@media (max-width: 480px) {
  body { font-size: 17px }
  .qtext { font-size: 1.3rem }
  .card { padding: 16px }
  .pick { font-size: 1.05rem; padding: 10px 12px }
  .keys { display: none }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important } }
</style>

// items: [{src, btn}]
function playSeq(items) {
  stopAudio();
  const token = playToken;
  queue = items.slice();
  spreekt = true;
  const next = () => {
    if (token !== playToken) return;
    const it = queue.shift();
    if (!it) { setActive(null); spreekt = false; return; }
    setActive(it.btn || null);
    player.src = "audio/" + it.src + ".mp3";
    player.playbackRate = TEMPI[tempoIdx][1];
    player.onended = () => setTimeout(next, it.gap ?? 350);
    player.onerror = () => next();
    player.play().catch(() => { setActive(null); spreekt = false; });
  };
  next();
}
const code = v => "v" + String(v.nr).padStart(2, "0");

// ---------- staat ----------
let reeks = [], pos = 0, antwoorden = {};
const app = document.getElementById("app");

function el(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; }
function esc(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

// ---------- startscherm ----------
function toonStart() {
  stopAudio(); stopTimer();
  const per = LESSEN.map(l => VRAGEN.filter(v => v.les === l).length);
  app.innerHTML = "";
  const card = el(`<section class="card">
    <div class="intro">
      <button class="speak" id="welkom" aria-label="Uitleg voorlezen">${ICON_SPEAK}</button>
      <p>Luister naar de vraag. Kies dan <b>A</b>, <b>B</b> of <b>C</b>. Druk op de luidspreker om iets opnieuw te horen.</p>
    </div>
    <div class="eyebrow">Kies wat je wilt oefenen</div>
    <div class="lessons">
      <button class="lesson all" data-les="*"><b>Alle vragen</b><span>Hoofdstuk 1 tot en met 6 · ${VRAGEN.length} vragen</span></button>
      ${LESSEN.map((l, i) => { const [k, t] = l.split(": "); return `<button class="lesson" data-les="${i}"><b>${esc(k)}</b><span>${esc(t)} · ${per[i]} vragen</span></button>`; }).join("")}
    </div>
    <p class="keys">Toetsen: <kbd>A</kbd> <kbd>B</kbd> <kbd>C</kbd> kiezen · <kbd>R</kbd> opnieuw voorlezen · <kbd>Enter</kbd> volgende vraag</p>
  </section>`);
  app.append(card);
  const w = card.querySelector("#welkom");
  w.onclick = () => playSeq([{ src: "welkom", btn: w }]);
  card.querySelectorAll(".lesson").forEach(b => b.onclick = () => {
    const k = b.dataset.les;
    start(k === "*" ? VRAGEN : VRAGEN.filter(v => v.les === LESSEN[+k]));
  });
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
// Elke start: vragen in willekeurige volgorde, en per vraag de antwoorden geshuffeld.
// v.f[p] = audiobestand (a/b/c, originele positie) van het antwoord op plaats p.
function start(lijst) {
  const orig = lijst.map(v => VRAGEN[v.nr - 1]);
  reeks = shuffle(orig).map(v => {
    const volg = shuffle([0, 1, 2]);
    return { ...v, a: volg.map(o => v.a[o]), c: volg.indexOf(v.c), f: volg.map(o => "abc"[o]) };
  });
  pos = 0; antwoorden = {}; toonVraag();
}
const aantalJuist = () => reeks.filter(x => antwoorden[x.nr] === x.c).length;
const antwoordAudio = (v, j, btn) => [{ src: "letter-" + L[j].toLowerCase(), btn, gap: 0 }, { src: code(v) + v.f[j], btn }];

// ---------- vraag ----------
function figuur(v) {
  if (!v.img) return "";
  return `<figure class="figure" data-img="${v.img}">
    <img alt="Afbeelding ${v.img}: ${esc(AFB[v.img])}" src="images/afbeelding-${v.img}.jpg">
  </figure>`;
}
function vulImg(fig) {
  if (!fig) return;
  const n = fig.dataset.img, img = fig.querySelector("img");
  const exts = ["jpg", "png", "jpeg", "webp", "gif", "svg"]; let i = 0;
  img.onerror = () => {
    i++;
    if (i < exts.length) img.src = `images/afbeelding-${n}.${exts[i]}`;
    else fig.innerHTML = `<div class="placeholder"><b>Afbeelding ${n}</b><span>${esc(AFB[n])}</span></div>`;
  };
}

// ---------- timer ----------
// Loopt alleen als er niets voorgelezen wordt: eerst luisteren, dan telt de tijd.
let timerId = null;
function stopTimer() { clearInterval(timerId); timerId = null; }
function startTimer(card, v) {
  stopTimer();
  const oud = card.querySelector(".timer"); if (oud) oud.remove();
  const totaal = TIJDEN[tijdIdx];
  if (!totaal) return;
  const t = el(`<div class="timer" role="timer"><div class="timer-top"><span class="timer-status"></span><b class="timer-sec"></b></div><div class="timer-bar"><i></i></div></div>`);
  card.querySelector(".qrow").before(t);
  let over = totaal * 1000, vorige = performance.now();
  const teken = () => {
    const sec = Math.ceil(over / 1000);
    t.querySelector(".timer-sec").textContent = sec + " s";
    t.querySelector(".timer-bar i").style.width = (over / (totaal * 1000)) * 100 + "%";
    t.querySelector(".timer-status").textContent = spreekt ? "⏸ Luister eerst" : "Nog";
    t.classList.toggle("paused", spreekt);
    t.classList.toggle("warn", sec <= 10 && sec > 5);
    t.classList.toggle("danger", sec <= 5);
  };
  teken();
  timerId = setInterval(() => {
    const nu = performance.now(), dt = nu - vorige; vorige = nu;
    if (!document.body.contains(t)) return stopTimer();
    if (!spreekt && !document.hidden) over -= dt;
    if (over <= 0) { over = 0; teken(); stopTimer(); tijdOm(card, v); return; }
    teken();
  }, 200);
}
function tijdOm(card, v) {
  if (antwoorden[v.nr] !== undefined) return;
  antwoorden[v.nr] = -1;  // -1 = geen antwoord gegeven
  toonUitslag(card, v, -1, true);
}

function leesVraag(card, v) {
  const items = [{ src: code(v), btn: card.querySelector(".qrow .speak") }];
  card.querySelectorAll(".ans").forEach((a, j) => items.push(...antwoordAudio(v, j, a.querySelector(".speak"))));
  playSeq(items);
}

function toonVraag() {
  const v = reeks[pos];
  const gekozen = antwoorden[v.nr];
  app.innerHTML = "";
  const juist = aantalJuist();
  app.append(el(`<div class="progress"><span>${pos + 1} / ${reeks.length}</span><div class="bar"><i style="width:${(pos / reeks.length) * 100}%"></i></div><span>✔ ${juist}</span></div>`));
  const card = el(`<section class="card">
    <div class="eyebrow">${esc(v.les)}</div>
    ${figuur(v)}
    <div class="qrow">
      <h2 class="qtext">${esc(v.q)}</h2>
      <button class="speak" aria-label="Vraag voorlezen">${ICON_SPEAK}</button>
    </div>
    <div class="answers">
      ${v.a.map((a, j) => `<div class="ans" data-j="${j}">
        <button class="pick"><span class="letter">${L[j]}</span><span>${esc(a)}</span><span class="mark"></span></button>
        <button class="speak small" aria-label="Antwoord ${L[j]} voorlezen">${ICON_SPEAK}</button>
      </div>`).join("")}
    </div>
    <div class="feedback" hidden></div>
    <div class="nav">
      <button class="btn ghost" id="terug">${pos === 0 ? "Menu" : "Vorige"}</button>
      <button class="btn" id="volgende" ${gekozen === undefined ? "disabled" : ""}>${pos === reeks.length - 1 ? "Resultaat" : "Volgende"}</button>
    </div>
  </section>`);
  app.append(card);
  vulImg(card.querySelector(".figure"));

  const qBtn = card.querySelector(".qrow .speak");
  qBtn.onclick = () => playSeq([{ src: code(v), btn: qBtn }]);
  card.querySelectorAll(".ans").forEach(a => {
    const j = +a.dataset.j;
    const sb = a.querySelector(".speak");
    sb.onclick = () => playSeq(antwoordAudio(v, j, sb));
    a.querySelector(".pick").onclick = () => kies(card, v, j);
  });
  card.querySelector("#terug").onclick = () => { if (pos === 0) toonStart(); else { pos--; toonVraag(); } };
  card.querySelector("#volgende").onclick = volgende;

  stopTimer();
  if (gekozen !== undefined) toonUitslag(card, v, gekozen, false);
  else { if (autoRead) leesVraag(card, v); startTimer(card, v); }
  window.scrollTo({ top: 0 });
}

function kies(card, v, j) {
  if (antwoorden[v.nr] !== undefined) return;
  antwoorden[v.nr] = j;
  toonUitslag(card, v, j, true);
}

function toonUitslag(card, v, j, metGeluid) {
  stopTimer();
  const tm = card.querySelector(".timer"); if (tm) tm.remove();
  const ok = j === v.c;
  card.querySelectorAll(".ans").forEach(a => {
    const k = +a.dataset.j;
    a.querySelector(".pick").disabled = true;
    if (k === v.c) { a.classList.add("correct"); a.querySelector(".mark").textContent = "✔"; }
    else if (k === j) { a.classList.add("wrong"); a.querySelector(".mark").textContent = "✘"; }
  });
  const fb = card.querySelector(".feedback");
  fb.hidden = false;
  fb.className = "feedback " + (ok ? "good" : "bad");
  fb.textContent = ok ? "Goed zo! Dat is juist." : `${j === -1 ? "De tijd is om." : "Niet juist."} Het juiste antwoord is ${L[v.c]}: ${v.a[v.c]}`;
  const nb = card.querySelector("#volgende");
  nb.disabled = false;
  if (metGeluid) {
    const juistBtn = card.querySelector(".ans.correct .speak");
    playSeq(ok ? [{ src: "goed" }] : [{ src: j === -1 ? "tijd-om" : "fout" }, { src: "juist-" + L[v.c].toLowerCase(), btn: juistBtn, gap: 0 }, { src: code(v) + v.f[v.c], btn: juistBtn }]);
    nb.focus({ preventScroll: true });
    const prog = document.querySelector(".progress span:last-child");
    if (prog) prog.textContent = "✔ " + aantalJuist();
  }
}

function volgende() {
  if (antwoorden[reeks[pos].nr] === undefined) return;
  if (pos < reeks.length - 1) { pos++; toonVraag(); } else toonEinde();
}

// ---------- einde ----------
function toonEinde() {
  stopTimer();
  const fout = reeks.filter(v => antwoorden[v.nr] !== v.c);
  const goed = reeks.length - fout.length;
  app.innerHTML = "";
  const card = el(`<section class="card">
    <div class="eyebrow">Resultaat</div>
    <div class="score">${goed} / ${reeks.length}</div>
    <p style="margin:0">${goed === reeks.length ? "Alles juist. Knap gedaan!" : `Je had ${goed} vragen juist en ${fout.length} vragen fout.`}</p>
    ${fout.length ? `<div class="eyebrow">Deze vragen waren fout</div>
      <div class="answers">${fout.map(v => `<div class="feedback bad" style="font-weight:400"><b>${esc(v.q)}</b><br>Juist: ${L[v.c]}. ${esc(v.a[v.c])}</div>`).join("")}</div>` : ""}
    <div class="nav">
      <button class="btn ghost" id="menu">Menu</button>
      ${fout.length ? `<button class="btn" id="opnieuw">Oefen de foute vragen</button>` : `<button class="btn" id="opnieuw">Opnieuw</button>`}
    </div>
  </section>`);
  app.append(card);
  playSeq([{ src: "einde" }]);
  card.querySelector("#menu").onclick = toonStart;
  card.querySelector("#opnieuw").onclick = () => start(fout.length ? fout : reeks);
}

// ---------- toetsenbord ----------
document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const card = app.querySelector(".card");
  if (!card || !card.querySelector(".qrow")) return;
  const v = reeks[pos];
  const k = e.key.toLowerCase();
  const map = { a: 0, b: 1, c: 2, "1": 0, "2": 1, "3": 2 };
  if (k in map) { kies(card, v, map[k]); e.preventDefault(); }
  else if (k === "r") { leesVraag(card, v); }
  else if (k === "enter" && document.activeElement?.tagName !== "BUTTON") { volgende(); }
  else if (k === "arrowright") volgende();
});

toonStart();
</script>

</html>
